<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Candidate portal | TalentTrack</title></head><body>
<header class="bar"><a class="logo" href="index.html">TalentTrack</a><nav><button class="tab on" data-t="jobs">Open jobs</button><button class="tab" data-t="apps">My applications</button><a href="admin.html">Admin portal</a></nav></header>
<main class="wrap">
<section id="jobs"><div class="tools"><input id="q" type="search" placeholder="Search by job title or skill" aria-label="Search jobs"><select id="dept" aria-label="Department"></select></div><div id="jobList" class="grid"></div></section>
<section id="apps" hidden><div class="tools"><input id="email" type="email" placeholder="Email you applied with" aria-label="Email"><button class="btn" id="lookup">Show my applications</button></div><div id="appList"></div></section>
</main>
<dialog id="dlg"><form id="form"><h2 id="jt">Apply</h2>
<label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel" pattern="[0-9+ ]{10,14}" title="Enter a 10 digit phone number" required></label>
<label>Resume (PDF)<input name="resume" type="file" accept=".pdf,.doc,.docx" required></label><label>Cover note (optional)<textarea name="note" rows="3"></textarea></label>
<div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Submit application</button></div></form></dialog>
<div id="toast" role="status"></div>
<script src="data.js"></script><script src="candidate.js"></script></body></html>
